lanes:
- id: continue
  label: Continue next · AIMS5701
  title: AIMS5701 HW1 independent attempt -> Bayes Nets continuation
  summary: HW1 remains the nearest delivery priority. The 7 Oct HMM introduction was guided and paused when the learner reported that the new lecture slides continue Bayes Nets; reconcile that live material before returning to HMM runway.
  target: search_complexity
  tasks:
  - title: Attempt HW1 independently
    when: Before 14 Oct
    topics: [search_complexity, ucs, astar]
    detail: >-
      Attempt the homework independently first. If blocked, use a separate
      transcript-recorded window with structurally equivalent but concretely
      different scaffolds; preserve the assignment acknowledgement boundary.
  - title: Reconcile the Bayes Nets continuation
    when: Next AIMS5701 lecture/retrieval block
    topics: [bayes, bayesian_networks]
    detail: >-
      Use the newly released slides and actual lecture emphasis. Cold-check DAG/CPT
      semantics, factorisation, the local Markov property, chain/fork/collider,
      explaining away and one changed multi-path d-separation query.
  - title: Keep sampling runway parked
    when: Until live teaching requires it
    topics: [bayesian_networks]
    detail: >-
      Rejection sampling, likelihood weighting and variable-elimination intuition were
      useful 30 Sep extensions but are absent from the Bayes Nets I deck. Preserve them
      as same-session guided evidence without treating them as current lecture scope.
  - title: Defer HMM/particle filtering
    when: Until live course reaches HMMs
    topics: [markov, hmm, particle_filtering]
    detail: >-
      The 7 Oct guided introduction is runway only. Diagnose remembered Markov-chain
      concepts and return to HMM filtering/particle filtering when the live sequence
      reaches the topic.
- id: parallel
  label: Parallel block · AIMS5702
  title: Lab readiness -> CNN bridge
  summary: The 1 Oct broad consolidation is complete. Close the remaining epoch/eval/metric-orchestration gap in one changed classifier, then extend locality/weight-sharing into CNN mechanics ahead of 15 Oct.
  target: pytorch_training
  tasks:
  - title: Close epoch/evaluation orchestration gap
    when: Next AIMS5702 block
    topics: [pytorch_training, mlp_classification, evaluation]
    detail: Fill model.train/eval, epoch wrapping, torch.no_grad, current-batch validation, argmax predictions, metric accumulation and epoch reporting in a nearly complete changed script; then reconstruct the full small pipeline once with minimal prompting.
  - title: Keep narrow tensor checks spaced
    when: Short retrieval only
    topics: [tensor_operations]
    detail: Sample integer index vs length-one slice, Linear weight orientation and one stepped-slice start/step/count problem; do not replay the broad 1 Oct sweep.
  - title: Begin bounded CNN bridge
    when: After the changed pipeline is stable
    topics: [cnn]
    detail: Build from image tensor shapes to locality, shared weights, kernels/channels, stride/padding and output-shape reasoning. Keep implementation depth proportional to the 15 Oct lecture.
- id: protect
  label: Protected delivery · FTEC5660 hackathon
  title: First structured extraction, then inspect failure
  summary: Case 01's semantic contract is now frozen as relationship candidates only. Deterministic code owns entity construction/typing, IDs and evidence normalisation; bounded coding-agent help may implement framework plumbing without redesigning semantics.
  target: prompt_chaining
  tasks:
  - title: Run Case 01 relationship extraction
    when: Current hackathon block
    topics: [prompt_chaining, lcel]
    detail: Implement source -> structured RelationshipCandidate[] behind the frozen contract, run the first real extraction and inspect the output. Add deterministic validation/normalisation only in response to concrete needs; do not add routing, retries or reflection pre-emptively.

