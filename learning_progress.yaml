lanes:
- id: continue
  label: Continue next · AIMS5702
  title: Assignment 1 — vectorised indexing -> interpolation
  summary: Pairwise dot-product representations are implemented in changed-example practice. The next genuine gap is advanced indexing and bilinear interpolation before the independent assignment attempt.
  target: tensor_interpolation
  tasks:
  - title: Finish the interpolation scaffold
    when: Next AIMS5702 study block
    topics: [tensor_operations, tensor_interpolation]
    detail: Briefly cold-retrieve one changed pairwise example, then move to indexed grid gathering, 1D interpolation and one 2D example. Do not replay the whole pairwise lesson.
  - title: Attempt Assignment 1 independently
    when: Before 24 Sep submission
    topics: [tensor_operations, tensor_interpolation]
    detail: Learner writes the assignment functions. Use progressive hints/debugging; do not copy the practice implementations into the notebook mechanically.
- id: parallel
  label: Parallel block · FTEC5660
  title: Receipts homework + Routing
  summary: Receipts homework is due 29 Sep. Use the coursework as the main implementation vehicle; routing remains within Tutorial 2 Part 1 only.
  target: routing
  tasks:
  - title: Resume receipt-chain project
    when: After the nearest AIMS5702 block / submission pressure
    topics: [prompt_chaining, lcel, routing]
    detail: Start from the stored multimodal receipt project plan, design the extraction contract, establish test/eval loops and introduce routing only if the workflow/evidence warrants it.
  - title: Maintain the Routing boundary
    when: Short changed-example retrieval
    topics: [routing, lcel]
    detail: Recover structured route decision -> RunnableBranch on one changed example. Parallelisation/reflection are not yet fair recall targets.
- id: protect
  label: Protected continuity · AIMS5701 + probability
  title: Search JIT -> trees; keep probability warm
  summary: Search theory is the immediate Fundamentals JIT target. Then shift the lead to regression/decision trees while keeping probability as a small diagnostic lane ahead of Bayesian networks/HMMs.
  target: search_complexity
  tasks:
  - title: Finish Week-2 search theory
    when: Before / around AIMS5701 Week 2
    topics: [ucs, astar, search_complexity, other_agents]
    detail: Consolidate guarantees/complexity and confirm other-agent scope; do not repeatedly rewrite algorithms that already have implementation evidence.
  - title: Build toward Week-3 trees
    when: After search pressure eases
    topics: [linear_regression, logistic_regression, decision_trees, random_forests]
    detail: Retrieve regression, then learn split/impurity/information-gain intuition and implement a tiny decision tree before relying on sklearn.
  - title: Small probability diagnostic
    when: Short recurring maintenance block
    topics: [bayes, probability, joint_moments]
    detail: Keep this small while assessed FTEC/AIMS work is nearer; increase it as Bayesian-network/HMM weeks approach.
