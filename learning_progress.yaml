  other_agents:
    name: Searching with other agents
    area: Classical AI
    concept: taught
    performance: guided
    review: recorded
    action: retrieve
    evidence: >-
      On 23 Sep pre-lecture work introduced adversarial search as alternating MAX/MIN
      agents, then minimax and alpha-beta pruning. After a deliberate turn-ownership
      reset, the learner correctly propagated changed game trees and explained several
      pruning decisions in player-choice language.
    boundary: >-
      This is same-session guided preparation, not delayed mastery. Turn ownership
      initially caused repeated inversions and one whole-subtree alpha-beta cutoff
      needed correction. No minimax/alpha-beta implementation has been attempted, and
      the exact live-course framing still needs confirmation in the lecture.
    next: >-
      Park implementation for now. The actual 23 Sep Lecture 2 deck did not cover
      minimax/alpha-beta. Retain this as useful guided pre-reading and cold-retrieve it
      only when a later live-course requirement explicitly brings adversarial search back.
