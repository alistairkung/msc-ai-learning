  ucs:
    name: Uniform-cost search
    area: Classical AI
    concept: demonstrated
    performance: guided
    review: recorded
    action: retrieve
    evidence: >-
      Lesson 33 records a passing guided UCS implementation. On 23 Sep delayed
      retrieval recovered lowest-g selection and cheaper-route replacement after one
      initial UCS/A* heuristic mix-up; goal-popped optimality was then corrected and
      immediately retrieved in recap.
    boundary: >-
      Heap/API implementation remains guided rather than cold-independent. The learner
      initially thought UCS used a heuristic and initially thought first discovery of
      the goal was sufficient; non-negative-cost assumptions still need consolidation.
    next: Briefly retrieve why goal-popped matters and cost assumptions; use a later changed weighted-graph blank-file implementation only as an operational spot check, not an immediate full search rewrite.
    sources: [search_lesson33, search_guarantees_20260923, state]
    evidence_on: '2026-09-23'
    depends_on: [bfs]
  astar:
    name: A* search
    area: Classical AI
    concept: demonstrated
    performance: guided
    review: recorded
    action: maintain
    evidence: >-
      Lesson 33 records guided A* implementation. On 23 Sep delayed retrieval recovered
      g, h, f and goal-popped reasoning. On 24 Sep the learner correctly classified
      changed consistency examples, reconstructed consistency=>admissibility on a changed
      path, reconstructed the A* blocking chain f(n)<=f(A)<f(B) with scaffolding, and
      connected consistency=>nondecreasing f=>safe permanent closing.
    boundary: >-
      Implementation remains guided. The 24 Sep proof work materially improved the
      conceptual model, but the first f(n)<=f(A) step and admissibility's exact role
      needed support. This is guided proof reconstruction, not delayed cold theorem mastery.
    next: >-
      Move A* out of the immediate JIT lane. After spacing, cold-reconstruct the local
      consistency condition, consistency=>admissibility and the blocking argument from
      f(n)<=f(A)<f(B); use a changed weighted-graph implementation only as an occasional
      operational spot check.
    sources: [search_lesson33, search_guarantees_20260923, state]
    evidence_on: '2026-09-24'
    depends_on: [ucs]
  prompt_chaining:
    name: Prompt chaining
    area: Agentic systems
    concept: demonstrated
    performance: guided
    review: recorded
    action: transfer
    evidence: >-
      Tutorial 1 decomposition has transferred into a completed assessed receipt system.
      Across 21-25 Sep the learner separated probabilistic image interpretation from
      deterministic calculation, designed a receipt contract, added reconciliation as a
      trust boundary, evaluated real model failures and completed the public E2E path.
    boundary: >-
      Changed-domain decomposition/system-design evidence is strong. Some repetitive
      validator helpers and test scaffolding were assistant-supplied, and successful
      submission does not imply cold reconstruction of every implementation detail.
    next: Receipts is complete; preserve the architecture as transfer evidence and
