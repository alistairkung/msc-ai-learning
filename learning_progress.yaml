paths:
- title: Weighted search
  topics: [bfs, ucs, astar, other_agents]
  note: Other-agent search is a new problem setting, not another frontier policy.
- title: Probability into model fitting
  topics: [bayes, distributions, logs_exponentials, mle, exponential_families]
  note: A learning route, not a claim that every earlier item is a strict mathematical prerequisite.
- title: Optimisation theory
  topics: [calculus, autograd, la_quadratic, convergence]
  note: The last step is explicit new teaching, not implied by implemented GD.
- title: Tensor vectorisation into interpolation
  topics: [numpy, tensor_operations, tensor_interpolation]
  note: Move from shape/broadcasting fluency into advanced indexed gathering and interpolation for the current AIMS5702 assignment; assignment completion is not automatically durable mastery.
timeline:
- label: Historical maths
  detail: JHU linear algebra and probability, plus chat-based calculus; evidence strength varies by topic.
- label: Lessons 01-09
  detail: Python fluency and DSA patterns.
- label: Lessons 10-20
  detail: NumPy/manual ML and pandas/data workflow.
- label: Lessons 21-26
  detail: Classical regression/classification and search.
- label: Lessons 27-31
  detail: Tensors, autograd, PyTorch and an end-to-end real-data workflow.
- label: 6 September
  detail: BFS independent reconstruction, DFS derivation and introductory search theory recorded.
- label: 8-9 September
  detail: Prompt Chaining taught, followed by guided Lesson 32 LCEL basics and a stored Tutorial 1 follow-up plan.
- label: 10 September
  detail: Lesson 33 completed the integrated BFS/DFS/UCS/A* practice suite; UCS and A* remain guided implementations and search guarantees/complexity remain due.
- label: 11 September
  detail: AIMS5702 tensor maintenance found strong broadcasting/reduction/semantic-shape reasoning with slicing/API rust that recovered quickly.
- label: 14 September
  detail: Stateful LCEL/validation practice went green with guided implementation; Tutorial 1 architecture was consolidated conceptually without promoting compact TaxCalcBench code to mastery.
- label: 16-17 September
  detail: Routing was taught through Tutorial 2 Part 1 and retrieved conceptually on changed domains; RunnableBranch syntax remains to be cold-retrieved.
- label: 17 September
  detail: AIMS5702 Assignment 1 pairwise dot-product practice implemented loop, broadcasting and einsum representations on changed examples. The subsequent lecture confirmed float32 VRAM/storage calculation but exposed dtype encoding, stride/contiguity, slicing/indexing and singleton-axis insertion as active retrieval gaps.
- label: 18 September
  detail: A targeted representation checkpoint taught/clarified signed int8, float exponent/significand, strides/contiguity, slicing/offsets and newaxis. Bilinear interpolation then moved from planned to conceptually demonstrated through manual changed examples and an understood SciPy test harness.
- label: 21 September
  detail: AIMS5702 Assignment 1 implementation completed. The learner mapped lecturer notation and loop semantics to the four-neighbour model, derived the no-loop (N,) tensor architecture, implemented paired advanced indexing and weighted interpolation with targeted debugging, and all supplied notebook tests are green.
- label: 21 September · FTEC5660
  detail: Receipt-chain contract v0 was designed from real receipts, a deterministic receipts 1+2 integration test was established, and the learner implemented the calculator green with exact Decimal arithmetic. Multimodal extraction remains next.
- label: 22 September · FTEC5660
  detail: The learner cold-retrieved core LCEL composition, learned multimodal message construction, implemented a reusable vision extraction chain, diagnosed runaway reasoning-token use, disabled thinking for the extraction stage, and matched receipt 1's structured ground truth.
- label: 23 September · AIMS5701
  detail: Morning/afternoon preparation reactivated search and built a minimax/alpha-beta bridge; the live Lecture 2 deck then confirmed single-agent/tree/graph search rather than adversarial search. Post-lecture gaps are now consistency intuition, consistency=>admissibility, the A* optimality proof and safe closing, plus a brief sweep of smaller lecture-only topics.
- label: 24 September · AIMS5701
  detail: Post-lecture reconciliation completed. The learner swept smaller Lecture 2 gaps, rebuilt iterative deepening after one mechanism correction, developed a durable local-edge intuition for consistency, reconstructed consistency=>admissibility on a changed path, reconstructed the A* blocking proof with support, and connected nondecreasing f to safe closing. Search now moves to spaced maintenance.
- label: 24 September · AIMS5702
  detail: >-
    Guided Lecture 3 preparation connected lecturer-style linear-layer indices and
    multiclass/objective notation to existing PyTorch knowledge, retrieved GD/SGD and
    the core training loop, exposed rust in TensorDataset/batch-label/zero_grad/no_grad
    orchestration, derived why nonlinearity is required, and introduced CNN motivation
    through locality plus weight sharing.
- label: 25 September · FTEC5660
