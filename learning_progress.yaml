    name: Real-data ML workflow
    area: Model building
    concept: demonstrated
    performance: implemented
    review: recorded
    action: transfer
    evidence: Lesson 31 contains data splitting, train-only scaling, tensor conversion, training/validation and final held-out evaluation.
    boundary: Repository code is observable; the degree of independent authorship and current transfer ability cannot be inferred from code alone.
    next: Transfer the pipeline to a changed problem when the course requires it. Ask the learner to choose and explain the pieces, not copy an orchestration method.
