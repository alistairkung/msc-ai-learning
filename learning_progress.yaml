defaults:
  new_material: &new
    concept: planned
    performance: pending
    review: not_due
    action: learn
    boundary: Prerequisite familiarity does not establish this capability. Teach explicitly before using it as a recall expectation.
    next: Introduce at the relevant syllabus point after checking its documented prerequisites.
    sources: [syllabus, roadmap]
    evidence_on: null
    depends_on: []
  implemented: &built
    concept: demonstrated
    performance: implemented
    review: unknown
    action: maintain
    boundary: Imported from the prior learning record, not freshly tested in this migration. Code presence does not establish independent authorship or current retention.
    next: Use a changed example when the next course task invokes this skill. Record support needed; do not automatically repeat the whole lesson.
    sources: [state, roadmap]
    evidence_on: null
    depends_on: []
  historical: &history
    concept: historical
    performance: historical
    review: diagnostic
    action: retrieve
    boundary: Historical worked learning is not a new test of current retention. Select the relevant subtopic; do not interpret a due diagnostic as failure.
    next: Retrieve one small relevant example before its course application; rebuild only the gap actually observed.
    sources: [state, roadmap]
    evidence_on: null
    depends_on: []
topics:
  bfs:
    name: BFS
    area: Classical AI
    concept: demonstrated
    performance: independent
    review: recorded
    action: maintain
    evidence: The 6 September session log records a complete independent BFS reconstruction after debugging two state-role mistakes. The practice solution was intentionally not committed.
    boundary: This is a logged session result, not an independently rerun test in this migration. It does not prove fluency in every search guarantee or permanent retention.
    next: Move forward to UCS. Keep the solution-free BFS practice test for occasional maintenance, not another compulsory repeat.
    sources: [search, state]
    evidence_on: '2026-09-06'
    depends_on: []
  dfs:
    name: DFS
    area: Classical AI
    concept: demonstrated
    performance: guided
    review: recorded
    action: maintain
    evidence: The session log records a successful BFS-to-DFS derivation and reasoning about neighbour insertion order.
    boundary: A guided transformation is distinct from a separate, independently reconstructed DFS implementation.
    next: Reuse this understanding during the search comparison. Do not restart a full DFS lesson unless a specific gap appears.
    sources: [search, state]
    evidence_on: '2026-09-06'
    depends_on: []
  ucs:
    name: Uniform-cost search
    area: Classical AI
    concept: taught
    performance: pending
    review: recorded
    action: build
    evidence: The learner traced accumulated-cost frontier choices correctly. Both the current state and the latest search log identify UCS implementation as the next step.
    boundary: No new standalone UCS implementation is recorded. Correct conceptual answers are not evidence of independent code reconstruction.
    next: Write UCS incrementally from a blank file, then compare paths and costs on a small weighted graph. The learner writes the implementation.
    sources: [search, state]
    evidence_on: '2026-09-06'
    depends_on: [bfs]
  astar:
    name: A* search
    area: Classical AI
    concept: demonstrated
    performance: implemented
    review: recorded
    action: build
    evidence: Lesson 26 records an earlier implementation. The 6 September session recovered g, h and f; admissibility and consistency were introduced, with consistency still fragile.
    boundary: An existing function is not proof of present independent recall. Graph-search guarantees and complexity are not recorded as fully consolidated.
    next: Reconstruct A* from the new UCS implementation. Then use a brief check of heuristic meaning and the assumptions behind guarantees.
    sources: [search, state]
    evidence_on: '2026-09-06'
    depends_on: [ucs]
  prompt_chaining:
    name: Prompt chaining
    area: Agentic systems
    concept: taught
    performance: guided
    review: recorded
    action: retrieve
    evidence: The log distinguishes the taught concept from the tutorial. Class reached successful expense-ledger parsing into JSON; the intended parse → compute → explain pipeline was introduced.
    boundary: The later notebook cells are not completed learning. The other 20 patterns in the overview are not automatic recall targets.
    next: On the planned FTEC return, briefly retrieve why checkable stages help, when not to chain, and the role of deterministic processing before moving into the next Tutorial 1 mechanisms.
