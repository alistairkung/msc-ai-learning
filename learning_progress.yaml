defaults:
  new_material: &new
    concept: planned
    performance: pending
    review: not_due
    action: learn
    boundary: Prerequisite familiarity does not establish this capability. Teach explicitly before using it as a recall expectation.
    next: Introduce at the relevant syllabus point after checking its documented prerequisites.
    sources: [syllabus, roadmap]
    evidence_on: null
    depends_on: []
  implemented: &built
    concept: demonstrated
    performance: implemented
    review: unknown
    action: maintain
    boundary: Imported from the prior learning record, not freshly tested in this migration. Code presence does not establish independent authorship or current retention.
    next: Use a changed example when the next course task invokes this skill. Record support needed; do not automatically repeat the whole lesson.
    sources: [state, roadmap]
    evidence_on: null
    depends_on: []
  historical: &history
    concept: historical
    performance: historical
    review: diagnostic
    action: retrieve
    boundary: Historical worked learning is not a new test of current retention. Select the relevant subtopic; do not interpret a due diagnostic as failure.
    next: Retrieve one small relevant example before its course application; rebuild only the gap actually observed.
    sources: [state, roadmap]
    evidence_on: null
    depends_on: []
topics:
  bfs:
    name: BFS
    area: Classical AI
    concept: demonstrated
    performance: independent
    review: recorded
    action: maintain
    evidence: The 6 September session log records a complete independent BFS reconstruction after debugging two state-role mistakes. Lesson 33 later refreshed the search comparison without displacing this as the strongest BFS evidence.
    boundary: Independent reconstruction still showed a recurring fixed-search-node vs moving-reconstruction-cursor fragility. It does not prove all search guarantees or permanent retention.
    next: Maintain with occasional changed-graph retrieval. Preserve explicit parent pointers so expansion order is not confused with the returned solution path.
    sources: [search, search_lesson33, state]
    evidence_on: '2026-09-06'
    depends_on: []
  dfs:
    name: DFS
    area: Classical AI
    concept: demonstrated
    performance: implemented
    review: recorded
    action: maintain
    evidence: Lesson 33 records a successful DFS reconstruction and passing tests after brief BFS/DFS recall; the main correction was an early return caused by indentation.
    boundary: This was performed immediately after BFS recall and with targeted debugging support, so it is refreshed/implemented evidence rather than pristine unaided cold reconstruction.
    next: Reuse DFS in the integrated search comparison; do not restart a full DFS implementation lesson unless a specific gap appears.
    sources: [search_lesson33, state]
    evidence_on: '2026-09-10'
    depends_on: []
  ucs:
    name: Uniform-cost search
    area: Classical AI
    concept: demonstrated
    performance: guided
    review: recorded
    action: retrieve
    evidence: >-
      Lesson 33 records a passing guided UCS implementation. On 30 Sep delayed
      midterm retrieval recovered lowest-g selection cold. On 6 Oct the learner again
      correctly explained that goal discovery is insufficient and that UCS is safe to
      terminate when the goal is popped as the lowest-g frontier item under the usual
      cost assumptions.
    boundary: >-
      Heap/API implementation remains guided rather than cold-independent. Manual graph
      bookkeeping is easier when the frontier is externalised on paper; do not interpret
      text-only working-memory load as a UCS conceptual failure. Exact theorem assumptions
      still deserve spaced retrieval.
    next: Maintain the goal-popped distinction through the independent HW1 attempt; do not replay the full UCS implementation unless a concrete gap appears.
    sources: [search_lesson33, search_guarantees_20260923, aims5701_prelecture_20260930, aims5701_hw1_recall_20261006, state]
    evidence_on: '2026-10-06'
    depends_on: [bfs]
  astar:
    name: A* search
    area: Classical AI
    concept: demonstrated
    performance: guided
    review: recorded
    action: maintain
    evidence: >-
      Lesson 33 records guided implementation and 24 Sep records the first deep proof
      reconstruction. On 30 Sep delayed retrieval recovered g/h/f, admissibility and the
      meaning of consistency cold. On 6 Oct a HW1-targeted generic recall repaired one
      g-versus-f accumulation slip, then independently classified a changed heuristic as
      both admissible and consistent after the two tests were re-separated. The learner
      also understood that an admissible-but-inconsistent heuristic can make f decrease
      along an edge and require reopening a closed node after a cheaper g is found.
    boundary: >-
      Implementation remains guided, and manual bookkeeping is representation-sensitive:
      external graph/frontier state materially reduces working-memory noise. The
      consistency => nondecreasing-f derivation was understood when shown but was
      explicitly not expected to return cold yet. Do not promote this to theorem mastery.
    next: >-
      On 7 Oct use one bounded confirmation pass: one UCS trace, one clean A* trace with
      explicit g/h/f and parent bookkeeping, one heuristic-design/admissibility probe,
      one admissible-but-inconsistent closed-set trace, and a brief consistency =>
      admissibility reconstruction. Stop if these return cleanly.
    sources: [search_lesson33, search_guarantees_20260923, aims5701_prelecture_20260930, aims5701_hw1_recall_20261006, state]
    evidence_on: '2026-10-06'
    depends_on: [ucs]
  prompt_chaining:
    name: Prompt chaining
    area: Agentic systems
    concept: demonstrated
    performance: guided
    review: recorded
    action: transfer
    evidence: >-
      Tutorial 1 decomposition transferred into the completed assessed receipt system.
      On 29 Sep the same contract-first discipline transferred into Private Client Graph.
      On 2 Oct the learner refined that boundary further: the raw LLM handoff was reduced
      to semantic relationship candidates only, while entity construction/typing, IDs,
      evidence deduplication and graph normalisation were explicitly kept deterministic.
      The first live Case 01 extraction then recovered all six intended edges with no extras.
      Evaluation was designed as a third separate concern using semantic edge normalization,
      TP/FP/FN and approved-evidence provenance rather than generated-ID comparison.
    boundary: >-
      Changed-domain decomposition/system-design evidence is strong. Some repetitive
      validator helpers and test scaffolding were assistant-supplied, and successful
      submission does not imply cold reconstruction of every implementation detail.
    next: Implement the deterministic Case 01 evaluator behind the frozen semantic scoring
      contract; use its diagnostics to choose the next benchmark difficulty before adding retries.
    sources: [prompt, tutorial1_arch, receipt_session, receipt_session_2, receipt_completion, private_client_graph_case01, private_client_graph_decision_extraction_contract, private_client_graph_decision_delegation, private_client_graph_decision_evaluation, state]
    evidence_on: '2026-09-17'
    depends_on: []
  lcel:
    name: LangChain / LCEL basics
    area: Agentic systems
    concept: demonstrated
    performance: guided
    review: recorded
    action: practice
    evidence: >-
      Lesson 34 records guided stateful LCEL. By 25 Sep the learner had transferred
      composition into a multimodal receipt system and explicitly pushed validation into
      the runnable with RunnableLambda plus semantic retry via with_retry after observing
      stochastic extraction failures.
    boundary: >-
      This is meaningful changed-domain LCEL transfer, but not delayed blank-file
      reconstruction or blanket mastery of Runnable APIs. RunnableBranch syntax remains
      outside cold-independent evidence.
    next: Use bounded coding assistance to implement source -> structured RelationshipCandidate[].
      Do not infer stronger LCEL fluency from delegated framework plumbing; review the
      resulting diff and actual model output before adding validation/retry stages.
    sources: [lcel_lesson, lcel_plan, lcel_stateful, routing_review, receipt_session_2, receipt_completion, private_client_graph_case01, private_client_graph_decision_extraction_contract, private_client_graph_decision_delegation, state]
    evidence_on: '2026-09-29'
    depends_on: [prompt_chaining]
  routing:
    name: Routing / conditional workflows
    area: Agentic systems
    concept: demonstrated
    performance: guided
    review: recorded
    action: practice
    evidence: Lecture 2 and Tutorial 2 Part 1 introduced routing. On 17 Sep the learner cold-retrieved fixed-chain vs branch selection, deterministic-vs-LLM router trade-offs, route-label separation from side effects, policy precedence and routing composed with downstream chains on changed property/receipt examples.
    boundary: '`RunnableBranch` implementation syntax has not yet been cold-retrieved. Tutorial 2 Part 2 parallelisation and Part 3 reflection remain outside the taught/retrieval boundary.'
    next: Reconstruct one changed structured-route -> RunnableBranch workflow, then stop at the end of Tutorial 2 Part 1 until later teaching advances.
    sources: [routing_review, state]
    evidence_on: '2026-09-17'
    depends_on: [lcel]
  bayes:
    name: Bayes & conditioning
    area: Math foundations
    concept: demonstrated
    performance: guided
    review: recorded
    action: retrieve
    evidence: >-
      On 28 Sep conditional/joint probability returned readily once notation was
      translated. Bayes' formula itself was not cold, but the learner reconstructed it
      from the same joint intersection viewed from opposite conditioning directions and
      then applied the population interpretation correctly.
    boundary: >-
      Formula recall was rusty and this is same-session derivation, not delayed mastery.
      Independence was initially confused with mutual exclusivity. Graphical-model
      inference is tracked separately.
    next: Cold-retrieve Bayes and the shared-intersection derivation on Wednesday before using the notation sheet.
    sources: [bayes_jit_20260928, probability_bridge, state]
    evidence_on: '2026-09-28'
    depends_on: []
  calculus:
    name: Derivatives -> gradients
    area: Math foundations
    concept: historical
    performance: implemented
    review: recorded
    action: maintain
    evidence: >-
      Historical calculus work and Lesson 28 cover gradients/chain rule. On 24 Sep the
      learner correctly used derivative sign to choose update direction, calculated a
      changed scalar gradient-descent step and interpreted a three-parameter gradient
      vector without reteaching the core mechanic.
    boundary: >-
      This is retrieval of gradient/update intuition, not evidence for convergence
      proofs, Hessians, convexity or adaptive-optimizer theory.
    next: Maintain through course use; introduce optimisation theory explicitly when required.
    sources: [aims5702_lecture03_session, state, roadmap]
    evidence_on: '2026-09-24'
    depends_on: []
  real_data_classification:
    name: Real-data ML workflow
    area: Model building
    concept: demonstrated
    performance: implemented
    review: recorded
    action: retrieve
    evidence: >-
      Lesson 31 contains splitting, train-only scaling, tensor conversion,
      TensorDataset/DataLoader, training/validation and held-out testing. On 24 Sep
      delayed reconstruction recovered 60/20/20 roles, batching, partial final batches,
      validation-vs-training behavior and shuffle intuition, while TensorDataset's role,
      y_batch shape, zero_grad() and validation no_grad() needed correction/prompting.
    boundary: >-
      The pipeline is rusty but recoverable. Core workflow understanding is stronger
      than cold API/orchestration recall; no full blank-file pipeline was implemented
      in this session.
    next: >-
      Later reconstruct one changed pipeline from concepts, focusing on TensorDataset,
      batch-axis shapes and validation orchestration rather than relearning splitting.
    sources: [pipeline, aims5702_lecture03_session, state]
    evidence_on: '2026-09-24'
    depends_on: []
  mle:
    name: Likelihood / MLE
    area: Math foundations
    concept: planned
    performance: pending
    review: not_due
    action: learn
    evidence: The roadmap and syllabus identify likelihood, log-likelihood and MLE as genuine extensions beyond the recovered probability foundation.
    boundary: Do not cold-test this as though it was covered in JHU. Missing new theory is not evidence that earlier probability has been forgotten.
    next: Plan explicit teaching after retrieving relevant distributions and introducing logs/exponentials. Do not pre-master the whole January module now.
    sources: [state, roadmap]
    evidence_on: null
    depends_on: [distributions, logs_exponentials]
