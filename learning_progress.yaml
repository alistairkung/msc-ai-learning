  tensor_operations:
    name: Tensor operations & pairwise vectorisation
    area: Model building
    concept: demonstrated
    performance: guided
    review: recorded
    action: practice
    evidence: The 11 Sep cold review found strong broadcasting/reduction/semantic-shape reasoning with slicing/API rust. On 17 Sep the learner implemented changed-example pairwise dot products with loops, broadcasting and einsum. On 18 Sep a targeted checkpoint taught signed int8/two's-complement and float exponent/significand intuition, then drilled strides, contiguity, slicing, offsets and singleton-axis insertion across changed examples.
    boundary: This remains guided/same-session evidence rather than delayed cold mastery. Bits/bytes units slipped initially; int8 representation was new; exponent-range vs significand-precision was initially reversed; transpose/stepped-slice contiguity and slice start-vs-step needed correction before transfer.
    next: Use only a short changed-example retrieval next time, especially slice start -> offset vs step -> stride and paired indexing. Do not replay the full representation lesson.
