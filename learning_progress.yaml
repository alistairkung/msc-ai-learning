paths:
- title: Weighted search
  topics: [bfs, ucs, astar, other_agents]
  note: Other-agent search is a new problem setting, not another frontier policy.
- title: Probability into model fitting
  topics: [bayes, distributions, logs_exponentials, mle, exponential_families]
  note: A learning route, not a claim that every earlier item is a strict mathematical prerequisite.
- title: Optimisation theory
  topics: [calculus, autograd, la_quadratic, convergence]
  note: The last step is explicit new teaching, not implied by implemented GD.
- title: Tensor vectorisation into interpolation
  topics: [numpy, tensor_operations, tensor_interpolation]
  note: Move from shape/broadcasting fluency into advanced indexed gathering and interpolation for the current AIMS5702 assignment; assignment completion is not automatically durable mastery.
timeline:
- label: Historical maths
  detail: JHU linear algebra and probability, plus chat-based calculus; evidence strength varies by topic.
- label: Lessons 01-09
  detail: Python fluency and DSA patterns.
- label: Lessons 10-20
  detail: NumPy/manual ML and pandas/data workflow.
- label: Lessons 21-26
  detail: Classical regression/classification and search.
- label: Lessons 27-31
  detail: Tensors, autograd, PyTorch and an end-to-end real-data workflow.
- label: 6 September
  detail: BFS independent reconstruction, DFS derivation and introductory search theory recorded.
- label: 8-9 September
  detail: Prompt Chaining taught, followed by guided Lesson 32 LCEL basics and a stored Tutorial 1 follow-up plan.
- label: 10 September
  detail: Lesson 33 completed the integrated BFS/DFS/UCS/A* practice suite; UCS and A* remain guided implementations and search guarantees/complexity remain due.
- label: 11 September
  detail: AIMS5702 tensor maintenance found strong broadcasting/reduction/semantic-shape reasoning with slicing/API rust that recovered quickly.
- label: 14 September
  detail: Stateful LCEL/validation practice went green with guided implementation; Tutorial 1 architecture was consolidated conceptually without promoting compact TaxCalcBench code to mastery.
- label: 16-17 September
  detail: Routing was taught through Tutorial 2 Part 1 and retrieved conceptually on changed domains; RunnableBranch syntax remains to be cold-retrieved.
- label: 17 September
  detail: AIMS5702 Assignment 1 pairwise dot-product practice implemented loop, broadcasting and einsum representations on changed examples; vectorised indexing/interpolation remains next.
