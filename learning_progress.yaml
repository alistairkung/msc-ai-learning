lanes:
- id: continue
  label: Continue next · Fundamentals
  title: Build UCS → reconstruct A*
  summary: BFS reconstruction is logged. Move forward, rather than restarting search.
  target: ucs
  tasks:
  - title: UCS, then A*
    when: Next study session
    topics: [ucs, astar]
    detail: Learner writes the important code. Keep conceptual help separate from API reminders.
  - title: Finish the Week-2 search coverage
    when: Before AIMS5701 Week 2
    topics: [bfs, dfs, search_complexity, other_agents]
    detail: Consolidate guarantees/complexity, confirm other-agent scope, then do one integrated review.
- id: parallel
  label: Parallel block · Fundamentals
  title: Preview logic; FTEC parked
  summary: Keep a small Week-1 logic preview alongside search. Agentic AI resumes one day before the next FTEC5660 lecture.
  target: logic
  tasks:
  - title: Logic preview
    when: Before AIMS5701 Week 1
    topics: [logic]
    detail: Reserve a short preview alongside search; do not wait until all Week-2 work is complete.
  - title: Resume Tutorial 1
    when: One day before the next FTEC5660 lecture
    topics: [lcel, prompt_chaining]
    detail: Do a 5–10 minute Lesson 32 cold check, then follow the stored plan through state enrichment, Python runnables and deterministic gates. Use payments/KYC examples rather than the tax pipeline.
  - title: Confirm FTEC5660 assessments
    when: When official details arrive
    topics: []
    detail: Hackathon/final-project dates, scope and weighting remain unconfirmed. Unknown workload is not zero workload.
- id: protect
  label: Protected continuity · January theory
  title: Retrieve maths selectively
  summary: Historical foundations exist. Check retention; distinguish refresh from new theory.
  target: bayes
  tasks:
  - title: One relevant maths target
    when: Recurring small block
    topics: [la_systems, bayes]
    detail: Choose the smallest useful diagnostic for upcoming matrix or inference work. No calendar booking implied.
  - title: Explicit new theory later
    when: Before the relevant January demand
    topics: [mle, convergence, kernels]
    detail: Protect continuity through project spikes. New topics are not an overdue recall pile.
