    evidence_on: '2026-09-08'
    depends_on: []
  lcel:
    name: LangChain / LCEL basics
    area: Agentic systems
    concept: taught
    performance: guided
    review: recorded
    action: practice
    evidence: Lesson 32 records passing changed-example pytest exercises for prompt templates, string/JSON parsers, invocation dictionaries and a two-stage sub-chain mapping. Two-stage composition required conceptual support.
    boundary: The implementation is guided evidence, not independent cold reconstruction. RunnablePassthrough.assign, RunnableLambda, gates and generated-code workflows remain new teaching rather than failed recall.
    next: 'Parked until one day before the next FTEC5660 lecture: do a 5–10 minute changed-example cold check, then study RunnablePassthrough.assign → RunnableLambda → deterministic gates using the Tutorial 1 plan.'
    sources: [prompt, state, lcel_lesson, lcel_plan]
    evidence_on: '2026-09-09'
    depends_on: [prompt_chaining]
  bayes:
    <<: *history
    name: Bayes & conditioning
    area: Math foundations
    evidence: The historical record preserves joint-versus-posterior confusion, constructing the total-probability denominator and the effect of base rates.
    boundary: This does not establish mastery of graphical-model inference or current unaided Bayes performance.
    next: Use a changed finite-counts/Bayes example without a refresher. Record the support needed, then repair only the observed gap.
