defaults:
  new_material: &new
    concept: planned
    performance: pending
    review: not_due
    action: learn
    boundary: Prerequisite familiarity does not establish this capability. Teach explicitly before using it as a recall expectation.
    next: Introduce at the relevant syllabus point after checking its documented prerequisites.
    sources: [syllabus, roadmap]
    evidence_on: null
    depends_on: []
  implemented: &built
    concept: demonstrated
    performance: implemented
    review: unknown
    action: maintain
    boundary: Imported from the prior learning record, not freshly tested in this migration. Code presence does not establish independent authorship or current retention.
    next: Use a changed example when the next course task invokes this skill. Record support needed; do not automatically repeat the whole lesson.
    sources: [state, roadmap]
    evidence_on: null
    depends_on: []
  historical: &history
    concept: historical
    performance: historical
    review: diagnostic
    action: retrieve
    boundary: Historical worked learning is not a new test of current retention. Select the relevant subtopic; do not interpret a due diagnostic as failure.
    next: Retrieve one small relevant example before its course application; rebuild only the gap actually observed.
    sources: [state, roadmap]
    evidence_on: null
    depends_on: []
topics:
  bfs:
    name: BFS
    area: Classical AI
    concept: demonstrated
    performance: independent
    review: recorded
    action: maintain
    evidence: The 6 September session log records a complete independent BFS reconstruction after debugging two state-role mistakes. Lesson 33 later refreshed the search comparison without displacing this as the strongest BFS evidence.
    boundary: Independent reconstruction still showed a recurring fixed-search-node vs moving-reconstruction-cursor fragility. It does not prove all search guarantees or permanent retention.
    next: Maintain with occasional changed-graph retrieval while prioritising search guarantees/complexity rather than another immediate full rewrite.
    sources: [search, search_lesson33, state]
    evidence_on: '2026-09-10'
    depends_on: []
  dfs:
    name: DFS
    area: Classical AI
    concept: demonstrated
    performance: implemented
    review: recorded
    action: maintain
    evidence: Lesson 33 records a successful DFS reconstruction and passing tests after brief BFS/DFS recall; the main correction was an early return caused by indentation.
    boundary: This was performed immediately after BFS recall and with targeted debugging support, so it is refreshed/implemented evidence rather than pristine unaided cold reconstruction.
    next: Reuse DFS in the integrated search comparison; do not restart a full DFS implementation lesson unless a specific gap appears.
    sources: [search_lesson33, state]
    evidence_on: '2026-09-10'
    depends_on: []
  ucs:
    name: Uniform-cost search
    area: Classical AI
    concept: demonstrated
    performance: guided
    review: recorded
    action: retrieve
    evidence: Lesson 33 records a passing UCS implementation covering cheapest-path selection, cheaper-route replacement, unreachable/start=goal cases and lower-cost paths with more edges. The learner articulated the unseen-or-cheaper update rule.
    boundary: Heap syntax, tuple roles, accumulated-vs-edge cost and update-condition logic needed targeted support. UCS is implemented with guided derivation, not delayed cold-independent reconstruction.
    next: Do not rewrite immediately. Consolidate non-negative-cost assumptions and goal-popped reasoning, then later test one changed weighted graph from a blank start.
    sources: [search_lesson33, state]
    evidence_on: '2026-09-10'
    depends_on: [bfs]
  astar:
    name: A* search
    area: Classical AI
    concept: demonstrated
    performance: guided
    review: recorded
    action: retrieve
    evidence: Lesson 33 derives A* from UCS using frontier entries carrying f, g and node; tests pass including zero heuristic reducing A* to UCS and heuristic-based prioritisation.
    boundary: Initial heap shape, tuple unpacking and correct heuristic lookup required support. Current implementation is guided/current, not delayed cold-independent A* reconstruction; guarantees remain separate work.
    next: Consolidate admissibility vs consistency and search assumptions, then later use one changed reconstruction to test independent retention.
    sources: [search_lesson33, state]
    evidence_on: '2026-09-10'
    depends_on: [ucs]
  prompt_chaining:
    name: Prompt chaining
    area: Agentic systems
    concept: demonstrated
    performance: guided
    review: recorded
    action: transfer
    evidence: Tutorial 1 was worked through conceptually beyond the original class stopping point. The learner can explain one-shot baseline vs decomposition, parse -> deterministic compute -> explain, failure localisation, and LLM-vs-code responsibility on changed domains.
    boundary: Conceptual transfer is strong, but the full compact TaxCalcBench/LCEL implementation is not independently reconstructable and US tax mechanics are intentionally out of scope.
    next: Use chaining inside real coursework where it fits rather than rebuilding the tax notebook; preserve explicit contracts and deterministic stages.
    sources: [prompt, tutorial1_arch, state]
    evidence_on: '2026-09-17'
    depends_on: []
  lcel:
    name: LangChain / LCEL basics
    area: Agentic systems
    concept: demonstrated
    performance: guided
    review: recorded
    action: practice
    evidence: Lesson 34 records a green learner implementation of state enrichment, RunnableLambda validation and deterministic routing after earlier LCEL basics. A changed-domain 17 Sep probe retrieved callable timing and contract reasoning while exposing remaining `.assign()` and nested-state syntax fragility.
    boundary: Successful guided implementation and same-session state tracing are not delayed cold-independent reconstruction. `.assign()` syntax and some nested Python state access still needed correction on the later probe.
    next: Keep syntax retrieval brief and changed-domain. Use coursework to reinforce state/contracts, and cold-retrieve `RunnableBranch` only within the taught Routing boundary.
    sources: [lcel_lesson, lcel_plan, lcel_stateful, routing_review, state]
    evidence_on: '2026-09-17'
    depends_on: [prompt_chaining]
  routing:
    name: Routing / conditional workflows
    area: Agentic systems
    concept: demonstrated
    performance: guided
    review: recorded
    action: practice
    evidence: Lecture 2 and Tutorial 2 Part 1 introduced routing. On 17 Sep the learner cold-retrieved fixed-chain vs branch selection, deterministic-vs-LLM router trade-offs, route-label separation from side effects, policy precedence and routing composed with downstream chains on changed property/receipt examples.
    boundary: `RunnableBranch` implementation syntax has not yet been cold-retrieved. Tutorial 2 Part 2 parallelisation and Part 3 reflection remain outside the taught/retrieval boundary.
    next: Reconstruct one changed structured-route -> RunnableBranch workflow, then stop at the end of Tutorial 2 Part 1 until later teaching advances.
    sources: [routing_review, state]
    evidence_on: '2026-09-17'
    depends_on: [lcel]
