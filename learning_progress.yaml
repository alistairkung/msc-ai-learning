lanes:
- id: continue
  label: Continue next · FTEC5660
  title: Receipts homework — constrained vertical slice
  summary: AIMS5702 Assignment 1 implementation is complete with supplied tests green. The active assessed-work focus is the receipts homework due 29 Sep.
  target: prompt_chaining
  tasks:
  - title: Complete validation and E2E receipt flow
    when: Next substantive block
    topics: [prompt_chaining, lcel]
    detail: Receipt 1 now completes real multimodal structured extraction and the deterministic calculator is green. Implement validation/Decimal normalisation, batch receipts, wire the homework interface and run the public eval. Do not add routing, reflection or repair unless evaluation shows a concrete need.
  - title: Evaluate and localise failures
    when: After the first end-to-end path runs
    topics: [prompt_chaining]
    detail: Use public receipts and live-model evaluation plus selective deterministic tests and one mocked integration path. Aim for one evidence-driven iteration.
- id: parallel
  label: Parallel block · AIMS5701
  title: Search JIT -> regression and trees
  summary: Search theory remains the immediate Fundamentals gap; then shift the lead to regression retrieval and decision trees/random forests for Week 3.
  target: search_complexity
  tasks:
  - title: Finish Week-2 search theory
    when: Before / around AIMS5701 Week 2
    topics: [ucs, astar, search_complexity, other_agents]
    detail: Consolidate completeness, optimality, complexity and A* assumptions without repeatedly rewriting already-implemented algorithms.
  - title: Build toward Week-3 trees
    when: After search pressure eases
    topics: [linear_regression, logistic_regression, decision_trees, random_forests]
    detail: Retrieve regression, then learn split, impurity and information-gain intuition and implement a tiny decision tree before relying on sklearn.
- id: protect
  label: Protected continuity · probability + AIMS5702
  title: Keep probability warm; maintain tensor transfer
  summary: Keep probability as a small diagnostic lane ahead of Bayesian networks/HMMs, while preserving Assignment 1 gains through later changed notation-to-vectorisation retrieval rather than immediate repetition.
  target: probability
  tasks:
  - title: Small probability diagnostic
    when: Short recurring maintenance block
    topics: [bayes, probability, joint_moments]
    detail: Keep this small while assessed FTEC work is nearer; increase it as Bayesian-network/HMM weeks approach.
  - title: Later tensor transfer check
    when: After spacing, not immediately
    topics: [tensor_operations, tensor_interpolation]
    detail: Use one changed notation-to-vectorisation problem to test transfer. Do not replay the completed assignment merely to manufacture mastery evidence.
