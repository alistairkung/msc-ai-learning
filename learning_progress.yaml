defaults:
  new_material: &new
    concept: planned
    performance: pending
    review: not_due
    action: learn
    boundary: Prerequisite familiarity does not establish this capability. Teach explicitly before using it as a recall expectation.
    next: Introduce at the relevant syllabus point after checking its documented prerequisites.
    sources: [syllabus, roadmap]
    evidence_on: null
    depends_on: []
  implemented: &built
    concept: demonstrated
    performance: implemented
    review: unknown
    action: maintain
    boundary: Imported from the prior learning record, not freshly tested in this migration. Code presence does not establish independent authorship or current retention.
    next: Use a changed example when the next course task invokes this skill. Record support needed; do not automatically repeat the whole lesson.
    sources: [state, roadmap]
    evidence_on: null
    depends_on: []
  historical: &history
    concept: historical
    performance: historical
    review: diagnostic
    action: retrieve
    boundary: Historical worked learning is not a new test of current retention. Select the relevant subtopic; do not interpret a due diagnostic as failure.
    next: Retrieve one small relevant example before its course application; rebuild only the gap actually observed.
    sources: [state, roadmap]
    evidence_on: null
    depends_on: []
topics:
  bfs:
    name: BFS
    area: Classical AI
    concept: demonstrated
    performance: independent
    review: recorded
    action: maintain
    evidence: The 6 September session log records a complete independent BFS reconstruction after debugging two state-role mistakes. Lesson 33 later refreshed the search comparison without displacing this as the strongest BFS evidence.
    boundary: Independent reconstruction still showed a recurring fixed-search-node vs moving-reconstruction-cursor fragility. It does not prove all search guarantees or permanent retention.
    next: Maintain with occasional changed-graph retrieval while prioritising search guarantees/complexity rather than another immediate full rewrite.
    sources: [search, search_lesson33, state]
    evidence_on: '2026-09-06'
    depends_on: []
  dfs:
    name: DFS
    area: Classical AI
    concept: demonstrated
    performance: implemented
    review: recorded
    action: maintain
    evidence: Lesson 33 records a successful DFS reconstruction and passing tests after brief BFS/DFS recall; the main correction was an early return caused by indentation.
    boundary: This was performed immediately after BFS recall and with targeted debugging support, so it is refreshed/implemented evidence rather than pristine unaided cold reconstruction.
    next: Reuse DFS in the integrated search comparison; do not restart a full DFS implementation lesson unless a specific gap appears.
    sources: [search_lesson33, state]
    evidence_on: '2026-09-10'
    depends_on: []
  ucs:
    name: Uniform-cost search
    area: Classical AI
    concept: demonstrated
    performance: guided
    review: recorded
    action: retrieve
    evidence: >-
      Lesson 33 records a passing guided UCS implementation. On 23 Sep delayed
      retrieval recovered lowest-g selection and cheaper-route replacement after one
      initial UCS/A* heuristic mix-up; goal-popped optimality was then corrected and
      immediately retrieved in recap.
    boundary: >-
      Heap/API implementation remains guided rather than cold-independent. The learner
      initially thought UCS used a heuristic and initially thought first discovery of
      the goal was sufficient; non-negative-cost assumptions still need consolidation.
    next: Briefly retrieve why goal-popped matters, consolidate cost assumptions, then later test one changed weighted graph from a blank start.
    sources: [search_lesson33, search_guarantees_20260923, state]
    evidence_on: '2026-09-23'
    depends_on: [bfs]
  astar:
    name: A* search
    area: Classical AI
    concept: demonstrated
    performance: guided
    review: recorded
    action: retrieve
    evidence: >-
      Lesson 33 records guided A* implementation. On 23 Sep delayed retrieval recovered
      g as cost-so-far, h as estimated remaining cost, f=g+h, lowest-f selection and
      h=0 reducing A* to UCS. Guarantee work then introduced/reinforced admissibility
      and consistency on changed examples.
    boundary: >-
      Implementation remains guided. Admissibility was initially inverted before
      transfer; consistency was new/fragile and required repeated examples before the
      estimated-progress vs edge-cost model stabilised. Do not claim delayed guarantee mastery.
    next: Cold-check admissibility/consistency, then consolidate A* optimality assumptions and the consistency-to-admissibility relationship before a later changed reconstruction.
    sources: [search_lesson33, search_guarantees_20260923, state]
    evidence_on: '2026-09-23'
    depends_on: [ucs]
  prompt_chaining:
    name: Prompt chaining
    area: Agentic systems
    concept: demonstrated
    performance: guided
    review: recorded
    action: transfer
    evidence: >-
      Tutorial 1 decomposition has now transferred into the assessed receipts project.
      On 21 Sep the learner separated probabilistic interpretation from deterministic
      calculation; on 22 Sep they built a real multimodal extraction path and used
      stage-localised evidence to diagnose model reasoning as the cause of empty output.
      Tutorial 1 was worked through conceptually beyond the original class stopping
      point. On 21 Sep the learner transferred the decomposition to the receipts
      homework: they separated probabilistic image interpretation from deterministic
      arithmetic, designed an extraction contract from real receipt evidence,
      distinguished authoritative values from reconciliation fields, and implemented
      the deterministic multi-receipt calculator behind a guiding integration test.
    boundary: >-
      Changed-domain transfer is strong, but multimodal syntax and model configuration
      are same-session/new evidence. Validation, batching and full E2E evaluation remain
      incomplete, and compact TaxCalcBench reconstruction is not a mastery target.
    next: Implement validation/Decimal normalisation, then batch receipts and run the
      public E2E eval before adding routing/reflection/repair complexity.
    sources: [prompt, tutorial1_arch, receipt_session, receipt_session_2, state]
    evidence_on: '2026-09-17'
    depends_on: []
  lcel:
    name: LangChain / LCEL basics
    area: Agentic systems
    concept: demonstrated
    performance: guided
    review: recorded
    action: practice
    evidence: >-
      Lesson 34 records guided green stateful LCEL. On 22 Sep delayed retrieval recovered
      prompt|llm|parser, prompt placeholders, ChatPromptTemplate, JsonOutputParser and
      assign roles; invocation mapping needed one correction. The learner then implemented
      a reusable multimodal ChatPromptTemplate -> DeepSeek -> JsonOutputParser chain.
    boundary: >-
      Core composition is increasingly transferable, but invocation-map syntax remains
      mildly fragile and multimodal content blocks/template-brace escaping were newly
      taught. This is not delayed cold-independent multimodal LCEL mastery.
    next: Reinforce through the remaining receipts integration rather than replaying
      syntax; keep validation deterministic and only retrieve RunnableBranch within its
      taught Routing boundary.
    sources: [lcel_lesson, lcel_plan, lcel_stateful, routing_review, receipt_session_2, state]
    evidence_on: '2026-09-22'
    depends_on: [prompt_chaining]
  routing:
    name: Routing / conditional workflows
    area: Agentic systems
    concept: demonstrated
    performance: guided
    review: recorded
    action: practice
    evidence: Lecture 2 and Tutorial 2 Part 1 introduced routing. On 17 Sep the learner cold-retrieved fixed-chain vs branch selection, deterministic-vs-LLM router trade-offs, route-label separation from side effects, policy precedence and routing composed with downstream chains on changed property/receipt examples.
    boundary: '`RunnableBranch` implementation syntax has not yet been cold-retrieved. Tutorial 2 Part 2 parallelisation and Part 3 reflection remain outside the taught/retrieval boundary.'
    next: Reconstruct one changed structured-route -> RunnableBranch workflow, then stop at the end of Tutorial 2 Part 1 until later teaching advances.
    sources: [routing_review, state]
    evidence_on: '2026-09-17'
    depends_on: [lcel]
