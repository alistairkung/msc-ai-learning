lanes:
- id: continue
  label: Continue next · AIMS5701
  title: Bridge regression into decision trees
  summary: Receipts is submitted and search is in spaced maintenance. Use a short regression/classification retrieval before genuinely new decision-tree material.
  target: decision_trees
  tasks:
  - title: Retrieve regression/classification anchors
    when: Next substantive study block
    topics: [linear_regression, logistic_regression]
    detail: Use brief changed-example retrieval only; do not replay the full historical regression lessons.
  - title: Learn decision trees
    when: After the regression retrieval
    topics: [decision_trees]
    detail: Build split intuition, Gini/entropy/information gain, recursive construction, stopping and overfitting for the next Fundamentals demand.
- id: parallel
  label: Parallel block · AIMS5702
  title: Lecture-break consolidation -> CNN bridge
  summary: Lecture 3 is complete. Consolidate observed tensor/PyTorch weak edges in one changed classification pipeline, then extend locality/weight-sharing into CNN mechanics ahead of 15 Oct.
  target: pytorch_training
  tasks:
  - title: Consolidate fragile edges
    when: Lecture-break week
    topics: [tensor_operations, pytorch_training, mlp_classification, real_data_classification]
    detail: Revisit unequal-rank broadcasting, equation-vs-PyTorch Linear weight orientation, indexed/objective notation, TensorDataset/DataLoader, batch-label shapes, zero_grad/no_grad and view-vs-copy/stride mechanics.
  - title: Begin bounded CNN bridge
    when: After consolidation is stable
    topics: [cnn]
    detail: Build from image tensor shapes to locality, shared weights, kernels/channels, stride/padding and output-shape reasoning. Keep implementation depth proportional to the 15 Oct lecture.
- id: protect
  label: Protected delivery · FTEC5660 hackathon
  title: Keep the 19 Oct solo hackathon visible
  summary: Receipts is closed. Incubate the hackathon without displacing the immediate trees JIT or AIMS5702 consolidation.
  target: routing
  tasks:
  - title: Incubate hackathon scope
    when: After the immediate JIT blocks
    topics: [prompt_chaining, lcel, routing]
    detail: Reuse learned agentic patterns only where the hackathon problem warrants them; do not add agentic complexity merely to demonstrate patterns.

