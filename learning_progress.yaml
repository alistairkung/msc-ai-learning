    <<: *built
    name: Python fluency
    area: Foundations
    evidence: Lessons 01-07 record containers, comprehensions, key functions and function arguments.
  dsa_patterns:
    <<: *built
    name: DSA patterns
    area: Foundations
    evidence: Lessons 08-09 record hash lookup, two pointers and sliding windows; broader algorithmic fluency is still developing.
  numpy:
    name: NumPy & shape reasoning
    area: Foundations
    concept: demonstrated
    performance: guided
    review: recorded
    action: maintain
    evidence: 'Historical NumPy work is reinforced by the 11 Sep tensor review: broadcasting and reductions were strong, while slicing/API naming showed rust that recovered quickly on changed examples.'
    boundary: Strong semantic shape reasoning does not imply automatic slicing syntax or every NumPy/PyTorch API name.
    next: Keep maintenance short and shape-first; use changed course examples rather than replaying the NumPy curriculum.
    sources: [tensor_review, state, roadmap]
    evidence_on: '2026-09-11'
    depends_on: []
  pandas:
    <<: *built
    name: pandas / data preparation
    area: Foundations
    evidence: Lessons 18-20 record selection, aggregation, missing values, joins and mixed retrieval.
  linear_regression:
    <<: *built
    name: Linear regression
    area: Model building
    evidence: Lessons 12 and 23 record manual linear mechanics, sklearn regression and MAE/MSE/R².
  logistic_regression:
    <<: *built
    name: Logistic regression
    area: Model building
    evidence: Lessons 21-22 record binary classification, probabilities, thresholds and confusion-matrix metrics.
  evaluation:
    <<: *built
    name: Evaluation & generalisation workflow
    area: Model building
    evidence: Lesson 31 connects train-only preprocessing, per-epoch validation and final held-out evaluation.
  tensor_operations:
    name: Tensor operations & pairwise vectorisation
    area: Model building
    concept: demonstrated
    performance: guided
    review: recorded
    action: practice
    evidence: >-
      The 1 Oct delayed sweep recovered axis/reduction semantics, unequal-rank
      right-aligned broadcasting, singleton insertion, pairwise dot products/einsum,
      reshape/flatten/transpose distinctions and view-versus-copy reasoning. The earlier
      broadcasting quiz miss repaired cleanly. Stepped-slice storage reasoning required
      substantial repair before one final changed example was solved correctly.
    boundary: >-
      Tensor concepts are broadly retrievable, but stepped-slice execution is not yet
      delayed-independent. The learner repeatedly mixed slice stop/count/shape with the
      step before stabilising the rule start -> offset, step -> stride, count -> shape.
      Integer indexing versus a length-one slice also remains a narrow recall trap.
    next: >-
      Do not replay the broad tensor sweep. Later sample one short changed stepped-slice
      problem plus integer-index-versus-slice shape preservation; otherwise move study
      time to PyTorch lab orchestration and then CNN mechanics.
    sources: [tensor_review, assignment1_pairwise, aims5702_lecture_reflection, assignment1_interpolation_bridge, tensor_practice, aims5702_lecture03_live, aims5702_consolidation_20261001, state]
    evidence_on: '2026-10-01'
    depends_on: []
  tensor_interpolation:
    name: Vectorised indexing & bilinear interpolation
    area: Model building
    concept: demonstrated
    performance: implemented
    review: recorded
    action: maintain
    evidence: On 21 Sep the learner translated the supplied loop/reference implementation and lecturer matrix notation into the four-neighbour model, derived the no-loop architecture by promoting per-query scalars to (N,) tensors, completed interp2d_nofor, and supplied a completed notebook whose interpolation tests are green against SciPy plus exact corner/centre and invalid-input checks.
    boundary: Implementation was guided/debugged rather than delayed cold-independent. The scalar interpolation formula and paired advanced indexing were not initially cold after the weekend; .long(), clamp max syntax and dtype/device handling needed support, with dtype/device/.to newly taught.
    next: Do not repeat the completed assignment immediately. Later test transfer with one changed notation-to-vectorisation problem and record support needed.
    sources: [assignment1_plan, assignment1_interpolation_bridge, assignment1_completion, state]
    evidence_on: '2026-09-21'
    depends_on: [tensor_operations]
  autograd:
    <<: *built
    name: Autograd & manual gradient descent
    area: Model building
    evidence: Lesson 28 makes the earlier manual gradient/chain-rule understanding executable.
  pytorch_training:
    <<: *built
    name: PyTorch training loop
    area: Model building
    review: recorded
    action: practice
    evidence: >-
      On 1 Oct the learner reconstructed Dataset/DataLoader setup, a 6 -> 12 -> ReLU -> 3
      model, CrossEntropyLoss/SGD intent and the core batch-training order
      zero_grad -> forward -> loss -> backward -> step. Epoch meaning and validation
      concepts were understood, but orchestration and metric bookkeeping were not
      independently produced.
    boundary: >-
      Core training semantics are stronger than API/orchestration recall. model(X) and
      loss.backward() needed API correction; validation first used whole X_val/y_val
      inside the loader loop; argmax accuracy, epoch-level accumulation and reporting
      were taught/shown. This is not a cold-independent end-to-end pipeline.
    next: >-
      Give a nearly complete changed classifier and have the learner fill only the epoch
      loop, model.train()/eval(), torch.no_grad(), batch predictions, loss/accuracy
      accumulation and epoch reporting. Then reconstruct the full small pipeline once
      with minimal prompting before moving on.
    sources: [pipeline, aims5702_lecture03_session, aims5702_lecture03_live, aims5702_consolidation_20261001, state]
