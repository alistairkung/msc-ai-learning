    evidence_on: '2026-09-23'
    depends_on: []
  search_complexity:
    name: Search guarantees & complexity
    area: Classical AI
    concept: demonstrated
    performance: guided
    review: recorded
    action: maintain
    evidence: >-
      The 23 Sep blocks established completeness/optimality and BFS/DFS complexity
      intuition. The 24 Sep post-lecture sweep verified state abstraction, graph-vs-tree,
      greedy, relaxed heuristics/dominance and graph-search duplicate handling. Iterative
      deepening needed one reteach of repeated depth-limited DFS, after which the learner
      correctly explained why repeated shallow work is cheap relative to deeper
      exponential growth. A* guarantee proofs were then reconstructed in depth.
    boundary: >-
      The reconciliation is sufficient to close the immediate Lecture 2 JIT gap, but
      proof mastery is not cold-independent. Iterative-deepening mechanism was not
      initially retained, exact theorem assumptions are not memorised, and the A*
      blocking proof required scaffolding.
    next: >-
      Search now moves to spaced maintenance. Later use a short changed-example check of
