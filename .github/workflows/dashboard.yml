name: Learning dashboard

on:
  pull_request:
    paths:
      - "learning_progress.yaml"
      - "dashboard/**"
      - "LEARNING_STATE.md"
      - "LEARNING_ROADMAP.md"
      - "MSC_SYLLABUS_MAP.md"
      - "lesson_logs/**"
      - "deep_learning/mlp/lesson31_real_data.py"
      - ".github/workflows/dashboard.yml"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "learning_progress.yaml"
      - "dashboard/**"
      - "LEARNING_STATE.md"
      - "LEARNING_ROADMAP.md"
      - "MSC_SYLLABUS_MAP.md"
      - "lesson_logs/**"
      - "deep_learning/mlp/lesson31_real_data.py"
      - ".github/workflows/dashboard.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-dashboard-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dashboard test dependencies
        run: python -m pip install "PyYAML>=6,<7" pytest "playwright==1.57.0"
      - name: Validate evidence, source references and syllabus coverage
        run: python -m pytest dashboard/test_build.py -q
      - name: Build dashboard
        run: python dashboard/build.py
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Browser smoke checks
        run: python dashboard/browser_smoke.py dashboard/site
      - name: Upload pull-request preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: learning-dashboard-preview
          path: dashboard/site
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    concurrency:
      group: learning-dashboard-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
